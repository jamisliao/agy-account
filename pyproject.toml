[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-account"
version = "0.1.0"
description = "Google Antigravity CLI (agy) Multi-Account & Keychain Manager for macOS"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Jamis Liao" }
]
keywords = ["antigravity", "agy", "google-gemini", "keychain", "account-rotation"]
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
agy-account = "agy_account.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
